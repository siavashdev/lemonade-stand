                    - text: 3 months ago
                  - generic [ref=f4e181]:
                    - generic [ref=f4e182]: Configure and manage automation of tasks questions tested practical use of Automation Accounts, runbooks, PowerShell or CLI scripts, and ARM templates for routine maintenance and patching. Practice writing and scheduling simple runbooks and using managed identities for authentication, a teammate passed after hands-on scripting practice.
