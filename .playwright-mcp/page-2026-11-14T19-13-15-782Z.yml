                    - generic [ref=f4e242]: I passed the Microsoft Administering Azure SQL Solutions exam after focusing on security basics like Azure AD auth, firewall rules, and least privilege in SQL. The biggest time sink was sorting out which features apply to SQL Database versus Managed Instance.
