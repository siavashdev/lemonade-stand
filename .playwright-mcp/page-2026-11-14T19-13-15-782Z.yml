                    - text: 2 months ago
                  - generic [ref=f4e141]:
                    - generic [ref=f4e142]: Planning and configuring HA and DR were scenario driven, asking you to pick zone redundancy, geo-replication, failover groups, or backup strategies to meet specific RTO and RPO. Study active geo-replication, failover group behavior, backup types and recovery testing so you can defend your choice in exam questions.
